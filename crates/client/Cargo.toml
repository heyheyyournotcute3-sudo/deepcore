    "bevy_gizmos_render",
    "bevy_light",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_camera",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_picking",
    "bevy_ui_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_asset",
    "bevy_window",
    "bevy_winit",
    "bevy_state",
    "bevy_log",
    "png",
    "x11",
    "multi_threaded",
