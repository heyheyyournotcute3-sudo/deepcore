[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/client", "crates/lobby"]
exclude = ["tools/atlas_gen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heyheyyournotcute3-sudo/deepcore"

# All versions are pinned exactly on purpose: the Bevy ecosystem breaks its API
# between releases, so a floating version range is a time bomb. Bump deliberately
# and re-verify against docs.rs. See docs/PLAN.md ("Dependency decisions").
[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false }
bevy_replicon = { version = "=0.45.5", default-features = false, features = [
    "client",
    "server",
] }
bevy_replicon_renet = { version = "=0.21.0", default-features = false, features = [
    "client",
    "server",
    "renet_netcode",
] }
bevy_egui = "=0.43.1"

serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.3"
postcard = { version = "=1.1.3", features = ["alloc"] }
zstd = "=0.14.3"
tracing = "=0.1.44"
thiserror = "=2.0.21"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
proptest = "=1.12.0"

# lobby (M10)
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
argon2 = "=0.6.0"
rand = "=0.10.3"

deepcore_shared = { path = "crates/shared" }

# Our own code compiles fast in dev; dependencies compile optimised once.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
